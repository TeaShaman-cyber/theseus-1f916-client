name: semantic package cross-repo probe

on:
  pull_request:
    paths:
      - .github/workflows/semantic-package-cross-repo-probe.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Fetch exact semdup package artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo=TeaShaman-cyber/theseus-research
          artifact_id=10614095162
          artifact_digest=3e659b6a41a79077b38b45ad48a9d094af81324916708a3e7ff1e5925fbc435e
          tar_sha=58894995a4a087be743a3b802a31df05677902c3b6829775382538b1a65bbbdb
          out="$RUNNER_TEMP/semdup-package"
          mkdir -p "$out"

          gh api             -H 'Accept: application/vnd.github+json'             "repos/$repo/actions/artifacts/$artifact_id"             > "$out/metadata.json"

          test "$(jq -r '.expired' "$out/metadata.json")" = false
          test "$(jq -r '.digest' "$out/metadata.json")" = "sha256:$artifact_digest"

          gh api             -H 'Accept: application/vnd.github+json'             "repos/$repo/actions/artifacts/$artifact_id/zip"             > "$out/artifact.zip"

          test "$(sha256sum "$out/artifact.zip" | awk '{print $1}')" = "$artifact_digest"
          unzip -q "$out/artifact.zip" -d "$out/unpacked"
          test "$(sha256sum "$out/unpacked/semdup-toolchain.tar.gz" | awk '{print $1}')" = "$tar_sha"

          {
            echo '### Cross-repository semantic package probe'
            echo
            echo '- source repository: `TeaShaman-cyber/theseus-research`'
            echo '- artifact id: `10614095162`'
            echo '- outer artifact digest: `VERIFIED`'
            echo '- inner toolchain tar SHA256: `VERIFIED`'
          } >> "$GITHUB_STEP_SUMMARY"
