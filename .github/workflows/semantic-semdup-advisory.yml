name: Semantic semdup advisory

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: semantic-semdup-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  trace:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare bounded trace input
        id: input
        shell: bash
        run: |
          set -euo pipefail
          profile=tools/semantic_qa/profile.json
          out="$RUNNER_TEMP/semantic-input"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
            task="pr-${{ github.event.pull_request.number }}"
          else
            base="$(git rev-parse HEAD^)"
            head="$(git rev-parse HEAD)"
            task="manual-${{ github.run_id }}"
          fi
          cache_key="semdup-db-v1-ubuntu24-schema3-src829f90ad-coderankembed-int4-$base"
          python3 tools/semantic_qa/trace_input.py             --base "$base"             --head "$head"             --output "$out"             --repository "${{ github.repository }}"             --task-id "$task"             --max-files "$(jq -r '.input_budget.max_files' "$profile")"             --max-total-bytes "$(jq -r '.input_budget.max_total_bytes' "$profile")"             --max-file-bytes "$(jq -r '.input_budget.max_file_bytes' "$profile")"
          {
            echo "SEMANTIC_BASE=$base"
            echo "SEMANTIC_HEAD=$head"
            echo "SEMANTIC_TASK=$task"
            echo "base=$base"
            echo "cache_key=$cache_key"
          } >> "$GITHUB_OUTPUT"
          {
            echo "SEMANTIC_BASE=$base"
            echo "SEMANTIC_HEAD=$head"
            echo "SEMANTIC_TASK=$task"
          } >> "$GITHUB_ENV"

      - name: Restore exact-base semdup DB
        id: db-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .semdup/cache
          key: ${{ steps.input.outputs.cache_key }}
          fail-on-cache-miss: false

      - name: Run packaged semdup advisory
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          out="$RUNNER_TEMP/semantic-semdup"
          input="$RUNNER_TEMP/semantic-input"
          mkdir -p "$out"
          python3 tools/semantic_qa/run_semdup_advisory.py             --repo .             --base-sha "$SEMANTIC_BASE"             --candidate-sha "$SEMANTIC_HEAD"             --repository "${{ github.repository }}"             --task-id "$SEMANTIC_TASK"             --profile tools/semantic_qa/profile.json             --input-manifest "$input/input-manifest.json"             --output-dir "$out"             --download-dir "$RUNNER_TEMP/semdup-package-download"             --runtime-dir "$RUNNER_TEMP/semdup-runtime"             --db-path .semdup/cache/semdup.sqlite             --db-cache-key "${{ steps.db-cache.outputs.cache-matched-key }}"
          if [ ! -f "$out/receipt.json" ]; then
            printf '%s
' '{"schema_version":1,"tool":"semdup","status":"UNAVAILABLE","reason":"orchestration_failed","acceptance_authority":false}' > "$out/receipt.json"
          fi
          status=$(jq -r '.status' "$out/receipt.json")
          freshness=$(jq -r '.toolchain.freshness.status // "CURRENTNESS_UNKNOWN"' "$out/receipt.json")
          reason=$(jq -r '.reason // ""' "$out/receipt.json")
          setup_ms=$(jq -r '.toolchain.setup_ms // 0' "$out/receipt.json")
          if [ "$freshness" = "STALE_AVAILABLE" ] || [ "$freshness" = "CURRENTNESS_UNKNOWN" ]; then
            echo "::warning title=semdup package freshness::$freshness"
          fi
          if [ "$reason" = "exact_base_db_cache_miss" ]; then
            echo "::warning title=semdup DB cache::exact base cache missing; cold embedding skipped by policy"
          fi
          {
            echo '### semdup advisory'
            echo
            echo "- status: `$status`"
            echo "- reason: `$reason`"
            echo "- DB cache key: `${{ steps.db-cache.outputs.cache-matched-key }}`"
            echo "- package freshness: `$freshness`"
            echo "- package setup ms: `$setup_ms`"
            echo "- candidate: `$SEMANTIC_HEAD`"
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0

      - name: Upload semantic trace
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: semantic-semdup-${{ env.SEMANTIC_TASK }}-${{ env.SEMANTIC_HEAD }}
          path: |
            ${{ runner.temp }}/semantic-input
            ${{ runner.temp }}/semantic-semdup
          if-no-files-found: warn
          retention-days: 90
