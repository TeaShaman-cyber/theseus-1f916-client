name: Semantic contract advisory

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: semantic-contract-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  trace:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        tool: [semble, needle3]
    steps:
      - name: Checkout candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Resolve semantic identity
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
            task="pr-${{ github.event.pull_request.number }}"
          else
            base="$(git rev-parse HEAD^)"
            head="$(git rev-parse HEAD)"
            task="manual-${{ github.run_id }}"
          fi
          {
            echo "base=$base"
            echo "head=$head"
            echo "task=$task"
          } >> "$GITHUB_OUTPUT"
          {
            echo "SEMANTIC_BASE=$base"
            echo "SEMANTIC_HEAD=$head"
            echo "SEMANTIC_TASK=$task"
          } >> "$GITHUB_ENV"

      - name: Prepare shared semantic mechanics
        id: mechanics
        uses: TeaShaman-cyber/marcopolo-cookbook/.github/actions/semantic-advisory-mechanics@01af605cd35e60cb55724e1abfcff7331bbfda3e
        with:
          profile-file: tools/semantic_qa/profile.json
          tool: ${{ matrix.tool }}
          base-sha: ${{ steps.identity.outputs.base }}
          candidate-sha: ${{ steps.identity.outputs.head }}
          repository: ${{ github.repository }}
          task-id: ${{ steps.identity.outputs.task }}
          output-root: ${{ runner.temp }}/semantic-mechanics-${{ matrix.tool }}
          runtime-dir: ${{ runner.temp }}/${{ matrix.tool }}-runtime

      - name: Run local contract advisory
        shell: bash
        run: |
          set +e
          tool="${{ matrix.tool }}"
          out="$RUNNER_TEMP/semantic-$tool"
          mkdir -p "$out"
          python3 tools/semantic_qa/run_contract_advisory.py             --tool "$tool"             --repository "${{ github.repository }}"             --task-id "$SEMANTIC_TASK"             --base-sha "$SEMANTIC_BASE"             --candidate-sha "$SEMANTIC_HEAD"             --profile tools/semantic_qa/profile.json             --mechanics-receipt "${{ steps.mechanics.outputs.receipt-path }}"             --input-manifest "${{ steps.mechanics.outputs.input-manifest }}"             --input-root "${{ steps.mechanics.outputs.input-root }}"             --corpus-dir docs/qa/semantic-contract-corpus             --output-dir "$out"             --runtime-dir "${{ steps.mechanics.outputs.runtime-dir }}"             --env-dir "$RUNNER_TEMP/$tool-env"
          rc=$?
          if [ "$rc" -ne 0 ] || [ ! -f "$out/receipt.json" ]; then
            echo '{"schema_version":1,"status":"UNAVAILABLE","reason":"orchestration_failed","acceptance_authority":false}' > "$out/receipt.json"
          fi
          status=$(jq -r '.status // "UNAVAILABLE"' "$out/receipt.json")
          freshness=$(jq -r '.toolchain.freshness.status // "CURRENTNESS_UNKNOWN"' "$out/receipt.json")
          setup_ms=$(jq -r '.toolchain.setup_ms // 0' "$out/receipt.json")
          cold_ms=$(jq -r '.cold.wall_ms // 0' "$out/receipt.json")
          warm_ms=$(jq -r '.warm.wall_ms // 0' "$out/receipt.json")
          if [ "$freshness" = "STALE_AVAILABLE" ] || [ "$freshness" = "CURRENTNESS_UNKNOWN" ]; then
            echo "::warning title=$tool package freshness::$freshness"
          fi
          {
            echo "### $tool contract advisory"
            echo
            echo "- status: `$status`"
            echo "- package freshness: `$freshness`"
            echo "- local setup ms: `$setup_ms`"
            echo "- cold retrieval ms: `$cold_ms`"
            echo "- warm retrieval ms: `$warm_ms`"
            echo "- candidate: `$SEMANTIC_HEAD`"
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0

      - name: Upload semantic trace
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: semantic-${{ matrix.tool }}-${{ env.SEMANTIC_TASK }}-${{ env.SEMANTIC_HEAD }}
          path: |
            ${{ runner.temp }}/semantic-mechanics-${{ matrix.tool }}
            ${{ runner.temp }}/semantic-${{ matrix.tool }}
          if-no-files-found: warn
          retention-days: 90
