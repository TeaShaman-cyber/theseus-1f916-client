name: Seed semdup DB cache

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: semantic-semdup-seed-main
  cancel-in-progress: true

jobs:
  seed:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Restore previous trusted DB
        id: db-restore
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .semdup/cache
          key: semdup-db-v1-ubuntu24-schema3-src829f90ad-coderankembed-int4-${{ github.sha }}
          restore-keys: |
            semdup-db-v1-ubuntu24-schema3-src829f90ad-coderankembed-int4-

      - name: Seed exact main DB
        if: ${{ steps.db-restore.outputs.cache-hit != 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/semantic-semdup-seed"
          mkdir -p "$out"
          python3 tools/semantic_qa/seed_semdup_cache.py             --repo .             --profile tools/semantic_qa/profile.json             --download-dir "$RUNNER_TEMP/semdup-package-download"             --runtime-dir "$RUNNER_TEMP/semdup-runtime"             --db-path .semdup/cache/semdup.sqlite             --output "$out/receipt.json"
          cat "$out/receipt.json" >> "$GITHUB_STEP_SUMMARY"

      - name: Save exact trusted DB
        if: ${{ steps.db-restore.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .semdup/cache
          key: semdup-db-v1-ubuntu24-schema3-src829f90ad-coderankembed-int4-${{ github.sha }}

      - name: Upload seed receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: semantic-semdup-seed-${{ github.sha }}
          path: ${{ runner.temp }}/semantic-semdup-seed
          if-no-files-found: ignore
          retention-days: 90
