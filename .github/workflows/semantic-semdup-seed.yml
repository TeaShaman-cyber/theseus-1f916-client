name: Seed semdup DB cache

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: semantic-semdup-seed-main
  cancel-in-progress: true

jobs:
  seed:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Restore previous trusted DB
        id: db-restore
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .semdup/cache
          key: semdup-db-v1-ubuntu24-schema3-src829f90ad-coderankembed-int4-${{ github.sha }}
          restore-keys: |
            semdup-db-v1-ubuntu24-schema3-src829f90ad-coderankembed-int4-

      - name: Prepare exact semdup package
        if: ${{ steps.db-restore.outputs.cache-hit != 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/semantic-semdup-seed"
          mkdir -p "$out"
          python3 tools/semantic_qa/seed_semdup_cache.py prepare             --profile tools/semantic_qa/profile.json             --download-dir "$RUNNER_TEMP/semdup-package-download"             --runtime-dir "$RUNNER_TEMP/semdup-runtime"             --output "$out/runtime.json"

      - name: Extract exact main corpus
        if: ${{ steps.db-restore.outputs.cache-hit != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/semantic-semdup-seed"
          binary=$(jq -r '.binary' "$out/runtime.json")
          cache_dir=$(jq -r '.cache_dir' "$out/runtime.json")
          db=.semdup/cache/semdup.sqlite
          mkdir -p .semdup/cache
          export SEMDUP_CACHE="$cache_dir"
          started=$(date +%s%3N)
          set +e
          "$binary" --db "$db" extract             --root .             --corpus main             --respect-gitignore             --granularity function             >"$out/extract.log" 2>&1
          rc=$?
          set -e
          ended=$(date +%s%3N)
          status=PASS
          [ "$rc" -eq 0 ] || status=FAIL
          db_bytes=0
          db_sha=""
          if [ -f "$db" ]; then
            db_bytes=$(stat -c %s "$db")
            db_sha=$(sha256sum "$db" | awk '{print $1}')
          fi
          jq -n             --arg status "$status"             --argjson returncode "$rc"             --argjson elapsed_ms "$((ended-started))"             --argjson db_bytes "$db_bytes"             --arg db_sha256 "$db_sha"             '{status:$status,returncode:$returncode,elapsed_ms:$elapsed_ms,db_bytes:$db_bytes,db_sha256:$db_sha256}'             > "$out/extract.json"
          cat "$out/extract.log"
          exit "$rc"

      - name: Embed pending main corpus
        if: ${{ steps.db-restore.outputs.cache-hit != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/semantic-semdup-seed"
          binary=$(jq -r '.binary' "$out/runtime.json")
          cache_dir=$(jq -r '.cache_dir' "$out/runtime.json")
          model=$(jq -r '.model_key' "$out/runtime.json")
          db=.semdup/cache/semdup.sqlite
          export SEMDUP_CACHE="$cache_dir"
          started=$(date +%s%3N)
          set +e
          "$binary" --db "$db" embed             --model "$model"             --provider cpu             >"$out/embed.log" 2>&1
          rc=$?
          set -e
          ended=$(date +%s%3N)
          status=PASS
          [ "$rc" -eq 0 ] || status=FAIL
          db_bytes=$(stat -c %s "$db")
          db_sha=$(sha256sum "$db" | awk '{print $1}')
          jq -n             --arg status "$status"             --argjson returncode "$rc"             --argjson elapsed_ms "$((ended-started))"             --argjson db_bytes "$db_bytes"             --arg db_sha256 "$db_sha"             '{status:$status,returncode:$returncode,elapsed_ms:$elapsed_ms,db_bytes:$db_bytes,db_sha256:$db_sha256}'             > "$out/embed.json"
          cat "$out/embed.log"
          exit "$rc"

      - name: Finalize seed receipt
        if: ${{ steps.db-restore.outputs.cache-hit != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/semantic-semdup-seed"
          python3 tools/semantic_qa/seed_semdup_cache.py finalize             --repo .             --profile tools/semantic_qa/profile.json             --db-path .semdup/cache/semdup.sqlite             --runtime "$out/runtime.json"             --phase-dir "$out"             --output "$out/receipt.json"
          {
            echo '### semdup trusted-main seed'
            echo
            jq -r '"- package setup ms: \(.package_setup_ms)"' "$out/receipt.json"
            jq -r '"- extract ms: \(.phases.extract.elapsed_ms)"' "$out/receipt.json"
            jq -r '"- embed ms: \(.phases.embed.elapsed_ms)"' "$out/receipt.json"
            jq -r '"- DB bytes: \(.db_bytes)"' "$out/receipt.json"
            jq -r '"- DB sha256: \(.db_sha256)"' "$out/receipt.json"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Save exact trusted DB
        if: ${{ steps.db-restore.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .semdup/cache
          key: semdup-db-v1-ubuntu24-schema3-src829f90ad-coderankembed-int4-${{ github.sha }}

      - name: Upload seed telemetry
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: semantic-semdup-seed-${{ github.sha }}
          path: ${{ runner.temp }}/semantic-semdup-seed
          if-no-files-found: ignore
          retention-days: 90
